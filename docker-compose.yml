version: '3.9'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ai-mesh-secure
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: sqlite:///./ai_mesh.db
      DEBUG: "true"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
